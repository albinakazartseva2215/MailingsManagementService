{% extends "mailings/base.html" %}

{% block content %}
<div class="container mt-5">
    <h1>Подтверждение отправки рассылки</h1>
    <p>Вы уверены, что хотите отправить рассылку "<strong>{{ mailing }}</strong>"?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, отправить</button>
        <a href="{% url 'mailings:mailing_detail' pk=mailing.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}

{% extends 'mailings/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-danger text-white">
            <h3>Блокировка рассылки</h3>
        </div>
        <div class="card-body">
            <p>Вы уверены, что хотите заблокировать рассылку?</p>
            <p><strong>Название:</strong> {{ object.message.subject }}</p>
            <p><strong>Статус:</strong> {{ object.get_status_mailing_display }}</p>
        </div>
        <div class="card-footer d-flex justify-content-between">
            <a href="{% url 'mailings:mailing_list' %}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Отмена
            </a>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="fas fa-ban"></i> Заблокировать
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пользователи</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
    <div class="col-6-sm-4 offset-md-1 py-4">
      <h4>Навигация</h4>
      <ul class="list-unstyled text-small">
        <li><a class="text-muted" href="{% url 'mailings:home' %}">Главная</a></li>
        {% if user.is_authenticated %}
          <li><a class="text-muted" href="{% url 'users:profile' user.pk %}">Мой профиль</a></li>
          <form action="{% url 'users:logout' %}" method="post" style="display: inline;">
              {% csrf_token %}
              <button type="submit" class="btn btn-link text-muted" style="padding: 0; border: none; background: none;">
                Выход
              </button>
          </form>
        {% else %}
          <li><a class="text-muted" href="{% url 'users:login' %}">Войти</a></li>
          <li><a class="text-muted" href="{% url 'users:register' %}">Регистрация</a></li>
        {% endif %}
      </ul>
    </div>
    {% if messages %}
    <div class="container mt-3">
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      {% endfor %}
    </div>
    {% endif %}
    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
